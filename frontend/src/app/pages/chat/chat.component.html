<div class="app-layout">
  <!-- Mobile overlay to close sidebar by tapping outside -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <app-sidebar 
    [currentSessionId]="currentSessionId()"
    [isOpen]="sidebarOpen()"
    (newChat)="startNewChat(); closeSidebar()"
    (selectSession)="loadSession($event); closeSidebar()">
  </app-sidebar>

  <main class="chat-main">
    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
        <span class="material-icons">menu</span>
      </button>
      <span class="mobile-title">Chief Knowledge Officer</span>
    </div>

    <!-- Messages Area -->
    <div class="messages-container" #messagesContainer>
      
      <!-- Empty State -->
      <div class="empty-state" *ngIf="messages().length === 0 && !isLoading()">
        <div class="logo-circle">
          <span class="material-icons logo-icon">corporate_fare</span>
        </div>
        <h1>How can I help you today?</h1>
        <p>Ask about company policies, upload documents, or search the global knowledge base.</p>
      </div>

      <!-- Message Thread -->
      <div class="message-thread" *ngIf="messages().length > 0 || isLoading()">
        <app-message-bubble 
          *ngFor="let msg of messages()"
          [role]="msg.role"
          [content]="msg.content"
          [citations]="msg.citations"
          [agentName]="msg.agent_name">
        </app-message-bubble>
        
        <app-typing-indicator *ngIf="isLoading()"></app-typing-indicator>
      </div>

    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="action-bar">
        <button class="action-btn" (click)="openUpload('user')">
          <span class="material-icons">upload_file</span>
          Upload Document
        </button>
        <button class="action-btn" *ngIf="auth.isHR" (click)="openUpload('global')">
          <span class="material-icons">public</span>
          Upload Global Document
        </button>
      </div>

      <div class="input-wrapper">
        <textarea 
          placeholder="Message Chief Knowledge Officer..." 
          [(ngModel)]="inputMessage"
          (keydown.enter)="$event.preventDefault(); sendMessage()"
          rows="1"
          autocomplete="off">
        </textarea>
        
        <button class="send-btn" [disabled]="!inputMessage.trim() || isLoading()" (click)="sendMessage()">
          <span class="material-icons">send</span>
        </button>
      </div>
      <div class="disclaimer">
        RAG Agent can make mistakes. Consider verifying important information.
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<!-- Modals -->
<app-upload-dialog *ngIf="showUploadDialog" [initialScope]="uploadScope" (close)="closeUpload()" (uploaded)="onUploaded($event)"></app-upload-dialog>

<!-- Upload success toast -->
<div class="upload-toast" *ngIf="uploadToastFile()">
  <span class="material-icons">check_circle</span>
  <div>
    <div class="toast-title">Document uploaded successfully!</div>
    <div class="toast-file">{{ uploadToastFile() }}</div>
  </div>
</div>
